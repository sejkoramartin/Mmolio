# TestFlight distribution.
#
# Deliberately NOT triggered by push: uploading a build is an outward-facing act and
# must be a decision, not a side effect of committing. Run it by hand from the Actions
# tab. A tag trigger can be added later if that becomes tedious.
#
# Every Apple credential arrives through GitHub Secrets, is materialised only inside
# $RUNNER_TEMP, and is destroyed in a cleanup step that runs even when the job fails.
# See README, "TestFlight deployment without a local Mac", for how to produce each one.

name: TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What to test (recorded in the job summary only)"
        required: false
        default: "Passive Medtrum CGM diagnostic build."

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: cz.sejkora.MedProbe
  SCHEME: MedProbe
  ARCHIVE_PATH: ${{ github.workspace }}/build/MedProbe.xcarchive
  EXPORT_DIR: ${{ github.workspace }}/build/export

jobs:
  testflight:
    name: Archive, export and upload
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Fail early and legibly if a credential is missing, naming only the secret that
      # is absent — never its value.
      - name: Preflight — required secrets present
        env:
          CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "${CERT_P12}" ]      || MISSING="${MISSING} APPLE_DISTRIBUTION_CERT_P12_BASE64"
          [ -n "${CERT_PASSWORD}" ] || MISSING="${MISSING} APPLE_DISTRIBUTION_CERT_PASSWORD"
          [ -n "${PROFILE}" ]       || MISSING="${MISSING} APPLE_PROVISIONING_PROFILE_BASE64"
          [ -n "${ASC_KEY_ID}" ]    || MISSING="${MISSING} APP_STORE_CONNECT_KEY_ID"
          [ -n "${ASC_ISSUER_ID}" ] || MISSING="${MISSING} APP_STORE_CONNECT_ISSUER_ID"
          [ -n "${ASC_KEY_P8}" ]    || MISSING="${MISSING} APP_STORE_CONNECT_API_KEY_P8_BASE64"

          if [ -n "${MISSING}" ]; then
            echo "::error::Missing required secret(s):${MISSING}"
            echo "See README → TestFlight deployment without a local Mac → GitHub Secrets."
            exit 1
          fi
          echo "All six required secrets are present."

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project MedProbe.xcodeproj

      # ---------------------------------------------------------------------------
      # Signing material. Everything below lives in $RUNNER_TEMP and is deleted by the
      # cleanup step. The keychain password is generated per run and never persisted.
      # ---------------------------------------------------------------------------

      - name: Import signing certificate into a temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/medprobe-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"

          # Decode straight to disk; the base64 never passes through the log.
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Auto-lock after 15 minutes, so the key does not sit unlocked if a later step hangs.
          security set-keychain-settings -lut 900 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # -T grants access to exactly the two tools that need it, rather than -A (everything).
          security import "$CERT_PATH" \
            -P "$CERT_PASSWORD" \
            -k "$KEYCHAIN_PATH" \
            -t cert -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Without this, codesign triggers an interactive prompt that no one can answer.
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          # Put our keychain in the search list so xcodebuild can find the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "=== Identities available for signing ==="
          # Prints identity names and hashes only — no key material.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        id: profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          PROFILE_PATH="$RUNNER_TEMP/medprobe.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          # Read the profile's own metadata rather than asking for it as extra secrets:
          # fewer values to keep in sync, and they cannot disagree with the profile.
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PLIST"

          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PLIST")
          EXPIRY=$(/usr/libexec/PlistBuddy -c "Print :ExpirationDate" "$PLIST")

          # None of these are credentials: they all appear in any shipped .ipa.
          echo "Profile name : $PROFILE_NAME"
          echo "Profile UUID : $PROFILE_UUID"
          echo "Team ID      : $TEAM_ID"
          echo "App ID       : $PROFILE_APP_ID"
          echo "Expires      : $EXPIRY"

          # Catch the classic mismatch before xcodebuild fails with something cryptic.
          if [ "$PROFILE_APP_ID" != "${TEAM_ID}.${BUNDLE_ID}" ]; then
            echo "::error::Provisioning profile is for ${PROFILE_APP_ID}, but this app is ${TEAM_ID}.${BUNDLE_ID}."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          rm -f "$PLIST" "$PROFILE_PATH"

          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------------
      # 1. ARCHIVE
      # ---------------------------------------------------------------------------

      - name: Archive (device, signed)
        run: |
          set -euo pipefail

          # github.run_number is monotonic per workflow and never reused, which is exactly
          # what App Store Connect requires of CFBundleVersion.
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Build number: $BUILD_NUMBER"

          xcodebuild archive \
            -project MedProbe.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="${{ steps.profile.outputs.team_id }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.profile.outputs.profile_name }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

          echo "::notice::ARCHIVE SUCCEEDED"

      - name: Inspect archive
        run: |
          set -euo pipefail
          PLIST="$ARCHIVE_PATH/Products/Applications/MedProbe.app/Info.plist"
          echo "CFBundleIdentifier      : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          echo "CFBundleShortVersionString: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          echo "CFBundleVersion         : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          echo "UIBackgroundModes       : $(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$PLIST")"
          echo
          echo "=== Code signature ==="
          codesign -dvvv "$ARCHIVE_PATH/Products/Applications/MedProbe.app" 2>&1 | grep -vi 'CDHash\|Hash choices' || true

      # ---------------------------------------------------------------------------
      # 2. EXPORT
      # ---------------------------------------------------------------------------

      - name: Export signed .ipa
        run: |
          set -euo pipefail

          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          scripts/make-export-options.sh \
            "${{ steps.profile.outputs.team_id }}" \
            "${{ steps.profile.outputs.profile_name }}" \
            "$BUNDLE_ID" \
            "$EXPORT_OPTIONS"

          echo "=== ExportOptions.plist ==="
          cat "$EXPORT_OPTIONS"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          echo "=== Exported ==="
          ls -lh "$EXPORT_DIR"

          IPA_PATH=$(find "$EXPORT_DIR" -name '*.ipa' -maxdepth 1 | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Export produced no .ipa"
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

          echo "::notice::EXPORT SUCCEEDED"

      # ---------------------------------------------------------------------------
      # 3. UPLOAD
      # ---------------------------------------------------------------------------

      - name: Upload to App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          # altool looks the key up by convention in this directory; there is no flag
          # that takes the key inline, so it is written here and deleted on cleanup.
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          export API_PRIVATE_KEYS_DIR="$KEY_DIR"

          echo "Validating before upload..."
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          echo "Uploading..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          echo "::notice::UPLOAD SUCCEEDED — Apple now processes the build asynchronously."

      - name: Job summary
        if: always()
        # The notes are free text from whoever ran the workflow, so they go through the
        # environment rather than being interpolated into the shell command.
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          {
            echo "## MedProbe TestFlight run"
            echo
            echo "- Build number: \`${{ github.run_number }}\`"
            echo "- Bundle ID: \`${{ env.BUNDLE_ID }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Notes: ${RELEASE_NOTES}"
            echo
            echo "Processing in App Store Connect takes a few minutes after upload."
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs even when an earlier step fails, so credentials never outlive the job.
      - name: Clean up signing material
        if: always()
        run: |
          set +e
          # Use the known path, not $KEYCHAIN_PATH: if the import step failed partway the
          # variable was never exported, but the keychain may still exist.
          security delete-keychain "$RUNNER_TEMP/medprobe-signing.keychain-db"
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
          rm -rf "$RUNNER_TEMP/private_keys"
          rm -f "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/profile.plist
          echo "Signing material removed."
          exit 0
