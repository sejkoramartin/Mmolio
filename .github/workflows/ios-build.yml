name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (iOS Simulator)
    runs-on: macos-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Toolchain versions
        run: |
          echo "=== macOS ==="
          sw_vers
          uname -m
          echo
          echo "=== Xcode ==="
          xcode-select -p
          xcodebuild -version
          echo
          echo "=== Swift ==="
          swift --version
          echo
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          echo
          echo "=== Schemes and targets ==="
          xcodebuild -list -project MedProbe.xcodeproj

      # No Apple Developer account is involved in stage 1. Everything below builds for
      # the simulator with signing disabled, which is enough to prove the code compiles.
      - name: Select a simulator destination
        id: destination
        run: |
          set -euo pipefail
          echo "=== Available simulators ==="
          xcrun simctl list devices available
          echo
          DEVICE_LINE=$(xcrun simctl list devices available | grep -E '^ +iPhone' | tail -1)
          if [ -z "$DEVICE_LINE" ]; then
            echo "::error::No available iPhone simulator on this runner"
            exit 1
          fi
          UDID=$(echo "$DEVICE_LINE" | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1)
          echo "Selected simulator: $DEVICE_LINE"
          echo "UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild build \
            -project MedProbe.xcodeproj \
            -scheme MedProbe \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.destination.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Unit tests (MedtrumPacketDecoder)
        run: |
          xcodebuild test \
            -project MedProbe.xcodeproj \
            -scheme MedProbe \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.destination.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Belt and braces: the safety contract is enforced by CI, not just by review.
      # MedProbe is a passive CGM listener and must never gain a BLE write path.
      - name: Assert no BLE write path exists
        run: |
          echo "Scanning sources for any write mechanism..."
          if grep -rnE 'writeValue|CBCharacteristicWriteType|withResponse|withoutResponse|setDesiredConnectionLatency|CBPeripheralManager' MedProbe MedProbeTests; then
            echo "::error::A BLE write path was found. MedProbe must stay read-only."
            exit 1
          fi
          echo "OK: no BLE write path in the source tree."

      # Signing material belongs in GitHub Secrets, never in git. This checks what is
      # actually tracked, which is the thing that would leak — .gitignore is the pair to it.
      - name: Assert no signing secrets are committed
        run: |
          set -euo pipefail
          echo "Scanning tracked files for signing artefacts..."
          if git ls-files | grep -iE '\.(p8|p12|pfx|mobileprovision|provisionprofile|cer|certSigningRequest|pem|key|keystore|jks)$'; then
            echo "::error::A signing artefact is committed to the repository. Remove it and rotate the credential."
            exit 1
          fi

          # An App Store Connect key is unmistakable even if the file was renamed.
          #
          # git grep exits 1 for "no match" and 128 for "bad pattern", and both are falsy,
          # so the status has to be inspected explicitly — otherwise a broken pattern reads
          # as a clean repository. That is exactly what happened with an earlier version of
          # this check, which contained an empty alternation and never actually ran.
          set +e
          git grep -lE 'BEGIN ([A-Z0-9]+ )?PRIVATE KEY' -- .
          GREP_STATUS=$?
          set -e

          if [ "$GREP_STATUS" -eq 0 ]; then
            echo "::error::A private key block is committed to the repository. Remove it and rotate the credential."
            exit 1
          elif [ "$GREP_STATUS" -ne 1 ]; then
            echo "::error::The private key scan itself failed (git grep exit $GREP_STATUS); refusing to report success."
            exit 1
          fi

          echo "OK: no signing artefacts tracked in git."

  # Everything the TestFlight workflow does, minus the parts that need Apple credentials.
  # This keeps the distribution path honest on every push instead of only discovering
  # breakage the next time someone tries to ship.
  archive-dry-run:
    name: Unsigned device archive (distribution dry run)
    runs-on: macos-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Supported export methods for this Xcode
        run: |
          # Confirms that "app-store-connect" (not the deprecated "app-store") is what
          # scripts/make-export-options.sh should be emitting.
          xcodebuild -help | sed -n '/-exportOptionsPlist/,/^$/p' | head -60
          echo
          xcodebuild -help | grep -A6 -i 'method' | head -40 || true

      - name: Generate and lint ExportOptions.plist
        run: |
          set -euo pipefail
          # Placeholder values: this only proves the file is well-formed and complete.
          scripts/make-export-options.sh \
            PLACEHOLDER0 \
            "Placeholder Profile Name" \
            cz.sejkora.MedProbe \
            "$RUNNER_TEMP/ExportOptions.plist"

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          echo
          plutil -p "$RUNNER_TEMP/ExportOptions.plist"

          METHOD=$(/usr/libexec/PlistBuddy -c "Print :method" "$RUNNER_TEMP/ExportOptions.plist")
          if [ "$METHOD" != "app-store-connect" ]; then
            echo "::error::Unexpected export method '$METHOD'"
            exit 1
          fi

      # The README tells the user to export their .p12 with OpenSSL's -legacy flag,
      # because OpenSSL 3 otherwise writes PBES2/AES-256 which `security import` refuses.
      # That claim is the most fragile step of the whole signing setup and it is cheap to
      # check here, so the documentation cannot quietly go stale.
      - name: Verify the README's OpenSSL .p12 recipe still holds
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/p12check"
          mkdir -p "$WORK"

          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$WORK/t.key" -out "$WORK/t.csr" \
            -subj "/CN=MedProbe p12 format check/C=CZ" 2>/dev/null
          openssl x509 -req -in "$WORK/t.csr" -signkey "$WORK/t.key" \
            -out "$WORK/t.crt" -days 1 2>/dev/null

          openssl pkcs12 -export          -inkey "$WORK/t.key" -in "$WORK/t.crt" -out "$WORK/modern.p12" -passout pass:checkpw
          openssl pkcs12 -export -legacy  -inkey "$WORK/t.key" -in "$WORK/t.crt" -out "$WORK/legacy.p12" -passout pass:checkpw

          KC="$RUNNER_TEMP/p12check.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPW" "$KC"
          security unlock-keychain -p "$KCPW" "$KC"

          echo "=== importing the -legacy .p12 (what the README tells the user to make) ==="
          if security import "$WORK/legacy.p12" -P checkpw -k "$KC" -t cert -f pkcs12 -T /usr/bin/codesign; then
            echo "OK: the -legacy .p12 imports, so the README's instructions work."
          else
            echo "::error::A -legacy .p12 no longer imports. The README recipe is wrong; fix it before anyone follows it."
            security delete-keychain "$KC" || true
            exit 1
          fi

          echo "=== importing the default OpenSSL 3 .p12 (expected to fail) ==="
          if security import "$WORK/modern.p12" -P checkpw -k "$KC" -t cert -f pkcs12 -T /usr/bin/codesign 2>&1; then
            echo "::warning::This runner now accepts a PBES2/AES-256 .p12 too, so -legacy is no longer strictly required. The README is still safe, just more cautious than it needs to be."
          else
            echo "Confirmed: the default OpenSSL 3 .p12 is rejected, which is exactly why the README insists on -legacy."
          fi

          security delete-keychain "$KC" || true
          rm -rf "$WORK"

      - name: Archive for a real device, unsigned
        run: |
          set -euo pipefail
          # generic/platform=iOS is the device destination — not a simulator archive.
          # Signing is the only thing skipped here; it is what the TestFlight workflow adds.
          xcodebuild archive \
            -project MedProbe.xcodeproj \
            -scheme MedProbe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MedProbe-dryrun.xcarchive" \
            CURRENT_PROJECT_VERSION=424242 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify archive contents and version injection
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MedProbe-dryrun.xcarchive/Products/Applications/MedProbe.app"
          PLIST="$APP/Info.plist"

          echo "=== Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print" "$PLIST"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")

          # The bundle ID is a fixed contract with App Store Connect, so it is asserted
          # literally: an accidental change should fail here.
          [ "$BUNDLE_ID" = "cz.sejkora.MedProbe" ] || { echo "::error::Bundle ID is $BUNDLE_ID"; exit 1; }

          # The marketing version is meant to change, so read the expectation from
          # project.yml rather than hardcoding it. What is being checked is that the value
          # in the spec reaches the bundle, not that it holds any particular number.
          EXPECTED_SHORT=$(grep -E '^[[:space:]]+MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$EXPECTED_SHORT" ]; then
            echo "::error::Could not read MARKETING_VERSION from project.yml"
            exit 1
          fi
          if [ "$SHORT" != "$EXPECTED_SHORT" ]; then
            echo "::error::CFBundleShortVersionString is '$SHORT', but project.yml says '$EXPECTED_SHORT'"
            exit 1
          fi
          echo "OK: marketing version $SHORT matches project.yml."


          # The whole point of the CFBundleVersion: $(CURRENT_PROJECT_VERSION) indirection
          # in project.yml: a build number passed on the command line must reach the bundle,
          # or every TestFlight upload after the first would be rejected as a duplicate.
          if [ "$BUILD" != "424242" ]; then
            echo "::error::Build number injection is broken: CFBundleVersion is '$BUILD', expected 424242"
            exit 1
          fi
          echo "OK: build number injection works."

          # An App Store build is rejected without an app icon, so check it was compiled in.
          if [ ! -f "$APP/AppIcon60x60@2x.png" ] && ! /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$PLIST" >/dev/null 2>&1; then
            echo "::error::No app icon in the built product; App Store Connect would reject the upload."
            exit 1
          fi
          echo "OK: app icon present."

          echo "=== Background modes ==="
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"

  # The Connect IQ side.
  #
  # A real compile cannot run here. The Connect IQ SDK archive ships the compiler and the
  # documentation, but not the per-device definitions — those come from the SDK manager,
  # a desktop tool with no CLI. Without them monkeyc rejects every device qualifier,
  # including in the universal export:
  #
  #     ERROR: 'fr255' is not a valid device / family qualifier.
  #
  # So this job checks everything that can be checked without the compiler, and the real
  # build is a documented local step. See garmin/README.md.
  garmin:
    name: Garmin project checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Project structure is complete
        run: |
          set -euo pipefail
          root=garmin/MedProbeWatch
          for required in \
            "$root/manifest.xml" \
            "$root/monkey.jungle" \
            "$root/source/MedProbeApp.mc" \
            "$root/source/GlucoseReading.mc" \
            "$root/source/GlucoseStore.mc" \
            "$root/source/Formatter.mc" \
            "$root/source/MedProbeFaceView.mc" \
            "$root/resources/properties.xml" \
            "$root/resources-fr255/layouts.xml" \
            "$root/resources-fr165/layouts.xml"; do
            test -f "$required" || { echo "::error::missing $required"; exit 1; }
          done
          echo "OK: every expected file is present."

      - name: XML is well formed
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import glob, sys, xml.etree.ElementTree as ET
          failed = False
          for path in sorted(glob.glob("garmin/MedProbeWatch/**/*.xml", recursive=True)):
              try:
                  ET.parse(path)
                  print(f"  ok   {path}")
              except ET.ParseError as error:
                  print(f"  FAIL {path}: {error}")
                  failed = True
          sys.exit(1 if failed else 0)
          PYEOF

      - name: Both target devices are declared
        run: |
          set -euo pipefail
          manifest=garmin/MedProbeWatch/manifest.xml
          for device in fr255 fr165; do
            grep -q "id=\"$device\"" "$manifest" || {
              echo "::error::$device is not in the manifest"; exit 1; }
            grep -q "^$device\." garmin/MedProbeWatch/monkey.jungle || {
              echo "::error::$device has no resource path in monkey.jungle"; exit 1; }
          done
          echo "OK: fr255 and fr165 are declared with their own resources."

      # The watch and the phone must agree on the message format. A compiler cannot catch
      # drift across two languages, so it is checked here.
      - name: Wire protocol matches on both sides
        run: |
          set -euo pipefail
          SWIFT=MedProbe/Garmin/GarminMessage.swift
          MONKEY=garmin/MedProbeWatch/source/GlucoseReading.mc

          swift_version=$(grep -oE 'currentVersion = [0-9]+' "$SWIFT" | grep -oE '[0-9]+')
          monkey_version=$(grep -oE 'SUPPORTED_VERSION = [0-9]+' "$MONKEY" | grep -oE '[0-9]+')
          echo "protocol version: Swift=$swift_version MonkeyC=$monkey_version"
          [ "$swift_version" = "$monkey_version" ] || {
            echo "::error::Protocol version differs between phone and watch"; exit 1; }

          for pair in 'version:v' 'mgdl:g' 'trend:t' 'measuredAt:m' 'source:s' 'sequence:q'; do
            name=${pair%%:*}
            key=${pair##*:}
            grep -q "static let $name = \"$key\"" "$SWIFT" || {
              echo "::error::Swift key for $name is not \"$key\""; exit 1; }
            grep -qE "KEY_[A-Z_]+ = \"$key\"" "$MONKEY" || {
              echo "::error::Monkey C is missing the key \"$key\""; exit 1; }
          done
          echo "OK: both sides agree on the wire format."

      # The watch must never present a stale reading as current, so the code that could
      # do so is checked for the guard rather than trusted.
      - name: Staleness is handled on the watch
        run: |
          set -euo pipefail
          grep -q "function isStale" garmin/MedProbeWatch/source/GlucoseReading.mc || {
            echo "::error::GlucoseReading has no isStale"; exit 1; }
          for view in MedProbeFaceView MedProbeView; do
            grep -q "isStale" "garmin/MedProbeWatch/source/$view.mc" || {
              echo "::error::$view does not check staleness"; exit 1; }
          done
          echo "OK: staleness is checked wherever a value is drawn."
