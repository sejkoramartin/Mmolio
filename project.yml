# XcodeGen project definition.
#
# The .xcodeproj is generated, never committed — this file is the source of truth.
# Regenerate with:  xcodegen generate
#
# Development happens on Linux, so the project must be describable as text and the
# real compile has to happen on a macOS GitHub Actions runner.

name: MedProbe

options:
  bundleIdPrefix: cz.sejkora
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Keep the CoreBluetooth delegate model simple; this is a diagnostic prototype,
    # not a place to fight Swift 6 strict concurrency.
    SWIFT_STRICT_CONCURRENCY: minimal
    # Definition of Done: the CI build fails on our own warnings.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES

targets:

  MedProbe:
    type: application
    platform: iOS
    sources:
      - path: MedProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.sejkora.MedProbe
        PRODUCT_NAME: MedProbe
        MARKETING_VERSION: "0.6.0"
        # Overridden on the xcodebuild command line by the TestFlight workflow, which
        # passes the GitHub run number so every uploaded build is unique.
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MedProbe/Info.plist
      properties:
        CFBundleDisplayName: MedProbe
        # Reference the build settings rather than literals, so the version numbers the
        # TestFlight workflow injects actually reach the bundle.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # MedProbe uses no encryption beyond what iOS itself provides. Declaring this
        # removes the per-build export compliance question in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required for any CoreBluetooth use, including read-only listening.
        NSBluetoothAlwaysUsageDescription: >-
          MedProbe listens passively to CGM glucose readings broadcast by your Medtrum pump.
          It never sends anything to the pump.
        # Prepared for later background operation; first-stage testing is foreground only.
        UIBackgroundModes:
          - bluetooth-central
        # Expose the capture file in Files.app, so a recording can be retrieved even if
        # the export button is unreachable — e.g. after a crash mid-session. These only
        # surface the app's own Documents folder to its owner; they grant no new access.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  MedProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MedProbeTests
    dependencies:
      - target: MedProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.sejkora.MedProbeTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MedProbe:
    build:
      targets:
        MedProbe: all
        MedProbeTests: [test]
    test:
      targets:
        - MedProbeTests
      gatherCoverageData: false
