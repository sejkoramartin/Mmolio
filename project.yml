# XcodeGen project definition.
#
# The .xcodeproj is generated, never committed — this file is the source of truth.
# Regenerate with:  xcodegen generate
#
# Development happens on Linux, so the project must be describable as text and the
# real compile has to happen on a macOS GitHub Actions runner.

name: MedProbe

options:
  bundleIdPrefix: cz.sejkora
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Keep the CoreBluetooth delegate model simple; this is a diagnostic prototype,
    # not a place to fight Swift 6 strict concurrency.
    SWIFT_STRICT_CONCURRENCY: minimal
    # Definition of Done: the CI build fails on our own warnings.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES

targets:

  MedProbe:
    type: application
    platform: iOS
    sources:
      - path: MedProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.sejkora.MedProbe
        PRODUCT_NAME: MedProbe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: MedProbe/Info.plist
      properties:
        CFBundleDisplayName: MedProbe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required for any CoreBluetooth use, including read-only listening.
        NSBluetoothAlwaysUsageDescription: >-
          MedProbe listens passively to CGM glucose readings broadcast by your Medtrum pump.
          It never sends anything to the pump.
        # Prepared for later background operation; first-stage testing is foreground only.
        UIBackgroundModes:
          - bluetooth-central

  MedProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MedProbeTests
    dependencies:
      - target: MedProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.sejkora.MedProbeTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MedProbe:
    build:
      targets:
        MedProbe: all
        MedProbeTests: [test]
    test:
      targets:
        - MedProbeTests
      gatherCoverageData: false
